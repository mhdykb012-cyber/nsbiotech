function go(v,id){HI=rnd();V=v;if(id!=null)LID=id;MSG='';RB=null;PEND=null;if(v=='lot'){TAB='w';hset('#lot-'+lot(LID).code)}else hset('#'+v);render()}
function login(){U=USERS[+$('#u').value];go('dash')}
function newLot(){
 const p=S.prods.find(x=>x.id==$('#lp').value),nm=($('#ln').value||'').trim();let mp=$('#lm').value;
 if(nm){if(!S.mats.some(m=>m.name.toLowerCase()==nm.toLowerCase()))S.mats.push({id:Date.now(),name:nm});mp=nm}
 if(!p)return err('Choisissez un produit.');if(!mp)return err('Choisissez ou saisissez une matière première.');
 const d=$('#ld').value||new Date().toISOString().slice(0,10),pre=p.pre+'-'+d.slice(0,4)+'-';
 const n=Math.max(0,...S.lots.filter(l=>l.code.startsWith(pre)).map(l=>+l.code.slice(pre.length)||0))+1,id=Date.now();
 S.lots.push({id,code:pre+String(n).padStart(3,'0'),d,prod:p.id,mp,or:$('#lo').value,resp:U.n,cr:id});save();go('lot',id)}
async function conn(){
 if(!('serial' in navigator)){MSG='Web Serial indisponible ici (utilisez Chrome ou Edge sur ordinateur). Repli : saisie manuelle.';return render()}
 try{const p=await navigator.serial.requestPort();await p.open({baudRate:+(S.bd||9600)});SERON=1;MSG='Balance connectée. Posez la charge : seule une valeur stable est reprise.';render();
 const rd=p.readable.pipeThrough(new TextDecoderStream()).getReader();let buf='';
 for(;;){const{value,done}=await rd.read();if(done)break;buf+=value;const ls=buf.split(/\r?\n/);buf=ls.pop();
  for(const x of ls){const m=x.match(/(-?\d+[.,]\d+)\s*(kg|g)/i);if(m&&!/\?/.test(x)){$('#wv').value=m[1].replace(',','.');$('#wu').value=m[2].toLowerCase();$('#wsr').value=1}}}
 }catch(e){MSG='Connexion balance impossible : '+e.message+'. Repli : saisie manuelle.';render()}}
function addW(){
 const l=lot(LID),c=calc(l),i=+$('#ws').value,raw=$('#wv').value.replace(',','.').trim(),v=parseFloat(raw),u=$('#wu').value,br=$('#wn').value=='b',ta=parseFloat(($('#wt').value||'0').replace(',','.'))||0;
 if(raw===''||isNaN(v)||v<0)return err('Poids invalide : saisissez un nombre positif.');
 let n=(u=='g'?v/1000:v),t=br?(u=='g'?ta/1000:ta):0;if(t>n)return err('La tare dépasse le poids brut.');n-=t;
 let p=null;for(let j=i-1;j>=0;j--)if(c.k[j]!=null){p=c.k[j];break}
 if(p!=null&&n>p&&PEND!=='w'){PEND='w';return err('Attention : la masse de sortie dépasse la masse d’entrée (ajout de matière, contenant ou erreur ?). Cliquez à nouveau sur Enregistrer pour confirmer.')}
 S.w.push({id:Date.now(),lot:l.id,step:i,val:v,unit:u,tare:t,kg:n,t:new Date().toISOString(),src:+$('#wsr').value,user:U.n,st:'ok'});PEND=null;if(BT.last)BT.last.used=true;save();MSG='Pesée enregistrée ✓';render()}
function addC(){const m=parseFloat($('#cm').value);if(isNaN(m)||m<0)return err('Montant invalide.');
